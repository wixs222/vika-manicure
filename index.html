            color: #666;

            color: white;

            background-color: #ff4757;

</head>

    <!-- Форма записи -->
    <div class="container">
        <h2>Запись на маникюр</h2>
        <form id="appointmentForm">
            <div class="form-group">
                <label for="clientName">Ваше имя:</label>
                <input type="text" id="clientName" required placeholder="Введите имя">
            </div>

                <label for="serviceType">Услуга:</label>
                <input type="text" id="serviceType" required placeholder="Например: Маникюр с покрытием">
            </div>

            <div class="form-group">
                <label for="appointmentDate">Дата и время:</label>
                <input type="datetime-local" id="appointmentDate" required>
            </div>

            <button type="submit">Записаться</button>
        </form>
    </div>

    <!-- Список записей -->
    <div class="list-container">
        <h2>Актуальные записи</h2>
        <div id="appointmentsList">Загрузка...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/appointments';

        // Функция загрузки списка записей с сервера
        async function loadAppointments() {
            try {
                const response = await fetch(API_URL);
                const appointments = await response.json();
                
                const listContainer = document.getElementById('appointmentsList');
                listContainer.innerHTML = '';

                if (appointments.length === 0) {
                    listContainer.innerHTML = '<p>Пока нет ни одной записи.</p>';
                    return;
                }

                appointments.forEach(app => {
                    const dateFormatted = new Date(app.appointment_date).toLocaleString();
                    const item = document.createElement('div');
                    item.className = 'appointment-item';
                    item.innerHTML = `
                        <strong>Имя:</strong> ${app.client_name}<br>
                        <strong>Услуга:</strong> ${app.service_type}<br>
                        <strong>Дата:</strong> ${dateFormatted}<br>
                        <button onclick="deleteAppointment(${app.id})">Отменить запись</button>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (error) {
                console.error('Ошибка загрузки записей:', error);
                document.getElementById('appointmentsList').innerHTML = '<p>Не удалось загрузить записи.</p>';
            }
        }

        // Отправка новой записи
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const client_name = document.getElementById('clientName').value;
            const service_type = document.getElementById('serviceType').value;
            const appointment_date = document.getElementById('appointmentDate').value;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ client_name, service_type, appointment_date })
                });

                if (response.ok) {
                    alert('Запись успешно создана!');
                    document.getElementById('appointmentForm').reset();
                    loadAppointments(); // Обновляем список
                } else {
                    alert('Ошибка при создании записи');
                }
            } catch (error) {
                console.error('Ошибка соединения:', error);
                alert('Не удалось подключиться к серверу.');
            }
        });

        // Функция удаления (отмены) записи
        async function deleteAppointment(id) {
            if (!confirm('Вы уверены, что хотите отменить эту запись?')) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Запись отменена.');
                    loadAppointments(); // Обновляем список
                } else {
                    alert('Не удалось удалить запись.');
                }
            } catch (error) {
                console.error('Ошибка удаления:', error);
            }
        }

        // Загружаем список при открытии страницы
        loadAppointments();
    </script>
