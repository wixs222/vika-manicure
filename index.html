<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на маникюр</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .client-booking-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .booking-date-group { background-color: #fff5f8; border: 1px solid #f8bbd0; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 12px; }
        .booking-date-header { background-color: #fce4ec; color: #c2185b; padding: 10px 15px; font-weight: bold; font-size: 14px; border-bottom: 1px solid #f8bbd0; display: flex; align-items: center; gap: 8px; }
        .booking-details-box { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .booking-time-client, .booking-service-client, .booking-master-client { font-size: 13px; display: flex; align-items: center; gap: 8px; color: #333; }
        .master-name-badge-client { display: inline-block; background-color: #e91e63; color: white; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; }
        
        .cancel-booking-btn { background-color: #f44336; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 8px; width: auto; align-self: flex-start; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .cancel-booking-btn:hover { background-color: #d32f2f; }

        .modal-overlay-client { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.6); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
        .modal-card-client { background-color: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2); width: 350px; text-align: center; position: relative; border-top: 5px solid #e91e63; }
        .modal-card-client h3 { color: #c2185b; margin-top: 0; margin-bottom: 15px; font-size: 18px; }
        .modal-card-client p { margin-bottom: 15px; font-size: 14px; color: #555; text-align: left; }
        .close-modal-client { position: absolute; top: 10px; right: 15px; font-size: 20px; color: #999; cursor: pointer; }
        
        .modal-card-client select {
            width: 100%;
            padding: 10px;
            border: 1px solid #f8bbd0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            background-color: #fff5f8;
            color: #c2185b;
            font-weight: bold;
        }

        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { margin-top: 0; flex: 1; }
        .secondary-modal-btn { background-color: #9e9e9e !important; }
        .secondary-modal-btn:hover { background-color: #757575 !important; }
    </style>
</head>
<body>

    <div class="top-link">
        <a href="master.html">Кабинет мастера ➔</a>
    </div>

    <div class="card">
        <h2>Онлайн-запись на маникюр</h2>
        <p>Заполните форму ниже, чтобы записаться на процедуру:</p>

        <form id="booking-form">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" placeholder="Введите имя" required>

            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" placeholder="+7 (999) 000-00-00" required>

            <label for="service">Выберите услугу:</label>
            <select id="service">
                <option value="Маникюр с покрытием">Маникюр с покрытием</option>
                <option value="Французский маникюр">Французский маникюр (Френч)</option>
                <option value="Педикюр">Педикюр</option>
                <option value="Снятие + Дизайн">Снятие + Дизайн</option>
                <option value="Маникюр с Спанч Бобом">Маникюр с Спанч Бобом</option>
            </select>

            <label for="master">Выберите мастера:</label>
            <select id="master">
                <option value="Любой свободный мастер">Любой свободный мастер</option>
                <option value="Анна">Анна</option>
                <option value="Елена">Елена</option>
            </select>

            <label for="datetime">Дата и время записи:</label>
            <input type="datetime-local" id="datetime" required>

            <button type="submit">Подтвердить запись</button>
        </form>

        <hr class="divider">
        <h3>Проверить мою запись</h3>
        <p style="font-size: 12px; color: #888; margin-top: -10px;">Введите ваш номер телефона</p>
        <input type="tel" id="search-phone" placeholder="Введите номер телефона">
        <button type="button" onclick="checkClientBooking()" class="secondary-btn">Найти запись</button>
        
        <div id="client-result" class="result-box"></div>
    </div>

    <!-- Модальное окно 1: Подтверждение отмены -->
    <div id="cancel-confirm-modal" class="modal-overlay-client">
        <div class="modal-card-client">
            <span class="close-modal-client" onclick="closeCancelConfirmModal()">&times;</span>
            <h3>Отменить запись?</h3>
            <p style="text-align: center;">Вы действительно хотите отменить выбранную запись?</p>
            <div class="modal-buttons">
                <button id="confirm-yes-btn" onclick="goToReasonModal()">Да, отменить</button>
                <button onclick="closeCancelConfirmModal()" class="secondary-modal-btn">Назад</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно 2: Выбор причины -->
    <div id="cancel-reason-modal" class="modal-overlay-client">
        <div class="modal-card-client">
            <span class="close-modal-client" onclick="closeCancelReasonModal()">&times;</span>
            <h3>Причина отмены</h3>
            <p>Выберите причину из списка:</p>
            
            <select id="cancel-reason-select">
                <option value="1. Болезнь">1. Болезнь</option>
                <option value="2. Отъезд">2. Отъезд</option>
                <option value="3. Иное">3. Иное</option>
            </select>

            <div class="modal-buttons">
                <button id="final-confirm-btn" onclick="finalCancelBooking()">Подтвердить отмену</button>
                <button onclick="backToConfirmModal()" class="secondary-modal-btn">Назад</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/bookings';
        let currentBookingId = null;

        function setMinDateTime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('datetime').min = now.toISOString().slice(0, 16);
        }
        window.onload = setMinDateTime;

        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phoneInput = document.getElementById('phone').value.trim();
            const cleanPhone = phoneInput.replace(/\D/g, '');

            if (cleanPhone.length < 10 || cleanPhone.length > 12) {
                alert('Неверный формат телефона! Введите от 10 до 12 цифр.');
                return;
            }

            const selectedDatetime = document.getElementById('datetime').value;
            const nowIso = new Date().toISOString().slice(0, 16);
            if (selectedDatetime < nowIso) {
                alert('Нельзя записаться на прошедшее время!');
                return;
            }

            const selectedMaster = document.getElementById('master').value;

            const newBooking = {
                name: document.getElementById('name').value,
                phone: cleanPhone,
                service: document.getElementById('service').value,master: selectedMaster,
                datetime: selectedDatetime
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newBooking)
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Ошибка при создании записи');
                    return;
                }

                alert('Вы успешно записались!');
                this.reset();
                setMinDateTime();
            } catch (err) {
                console.error(err);
                alert('Не удалось подключиться к серверу!');
            }
        });

        async function checkClientBooking() {
            const phoneInput = document.getElementById('search-phone').value.trim();
            const cleanSearchPhone = phoneInput.replace(/\D/g, '');
            const resultDiv = document.getElementById('client-result');

            if (!cleanSearchPhone) {
                resultDiv.innerHTML = "<p style='color: #c2185b;'>Введите номер телефона для поиска.</p>";
                return;
            }

            try {
                const response = await fetch(API_URL);
                const bookings = await response.json();

                const myBookings = bookings.filter(b => {
                    const cleanStoredPhone = String(b.phone).replace(/\D/g, '');
                    return cleanStoredPhone === cleanSearchPhone || cleanStoredPhone.endsWith(cleanSearchPhone);
                });

                myBookings.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));
                resultDiv.innerHTML = "";

                if (myBookings.length === 0) {
                    resultDiv.innerHTML = "<p style='color: #c2185b;'>Записей на этот номер не найдено.</p>";
                    return;
                }

                const listContainer = document.createElement('div');
                listContainer.className = 'client-booking-list';

                const groupedBookings = {};
                myBookings.forEach(b => {
                    const datePart = b.datetime.split('T')[0];
                    if (!groupedBookings[datePart]) groupedBookings[datePart] = [];
                    groupedBookings[datePart].push(b);
                });

                for (const [date, items] of Object.entries(groupedBookings)) {
                    const dateGroup = document.createElement('div');
                    dateGroup.className = 'booking-date-group';

                    const [year, month, day] = date.split('-');
                    const formattedDate = `${day}.${month}.${year}`;

                    const header = document.createElement('div');
                    header.className = 'booking-date-header';
                    header.innerHTML = `<i class="far fa-calendar-alt"></i> Дата: ${formattedDate}`;
                    dateGroup.appendChild(header);

                    items.forEach(b => {
                        const box = document.createElement('div');
                        box.className = 'booking-details-box';

                        const timeOnly = b.datetime.split('T')[1] || '';
                        box.innerHTML = `
                            <div class="booking-time-client"><i class="far fa-clock"></i> <b>Время:</b> ${timeOnly}</div>
                            <div class="booking-service-client"><i class="fas fa-sparkles"></i> <b>Услуга:</b> ${b.service}</div>
                            <div class="booking-master-client"><i class="fas fa-user-tie"></i> <b>Мастер:</b> <span class="master-name-badge-client">${b.master}</span></div>
                            <button class="cancel-booking-btn" onclick="openCancelConfirmModal(${b.id})">
                                <i class="fas fa-times-circle"></i> Отменить запись</button>
                        `;
                        dateGroup.appendChild(box);
                    });

                    listContainer.appendChild(dateGroup);
                }

                resultDiv.appendChild(listContainer);
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = "<p style='color: #c2185b;'>Ошибка соединения с сервером.</p>";
            }
        }

        function openCancelConfirmModal(id) {
            currentBookingId = id;
            document.getElementById('cancel-confirm-modal').style.display = 'flex';
        }

        function closeCancelConfirmModal() {
            document.getElementById('cancel-confirm-modal').style.display = 'none';
        }

        function goToReasonModal() {
            closeCancelConfirmModal();
            document.getElementById('cancel-reason-modal').style.display = 'flex';
        }

        function closeCancelReasonModal() {
            document.getElementById('cancel-reason-modal').style.display = 'none';
            currentBookingId = null;
        }

        function backToConfirmModal() {
            document.getElementById('cancel-reason-modal').style.display = 'none';
            document.getElementById('cancel-confirm-modal').style.display = 'flex';
        }

        async function finalCancelBooking() {
            if (!currentBookingId) return;
            const reason = document.getElementById('cancel-reason-select').value;

            try {
                const response = await fetch(`${API_URL}/${currentBookingId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    alert('Не удалось удалить запись на сервере.');
                    return;
                }

                alert(`Запись успешно отменена. Причина: ${reason}`);
                closeCancelReasonModal();
                checkClientBooking();
            } catch (err) {
                console.error(err);
                alert('Ошибка соединения с сервером при отмене.');
            }
        }
    </script>
</body>
</html>
