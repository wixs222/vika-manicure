<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на маникюр</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Запись на маникюр</h1>
        
        <!-- Форма записи -->
        <form id="booking-form">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" required placeholder="Введите ваше имя">

            <label for="phone">Номер телефона:</label>
            <input type="tel" id="phone" required placeholder="+79191991919">

            <label for="service">Выберите услугу:</label>
            <select id="service" required>
                <option value="Маникюр">Маникюр</option>
                <option value="Педикюр">Педикюр</option>
                <option value="Наращивание">Наращивание</option>
            </select>

            <label for="master">Выберите мастера:</label>
            <select id="master" required>
                <option value="Анна">Анна</option>
                <option value="Мария">Мария</option>
                <option value="Любой свободный мастер">Любой свободный мастер</option>
            </select>

            <label for="datetime">Дата и время записи:</label>
            <input type="datetime-local" id="datetime" required>

            <button type="submit">Подтвердить запись</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

        <!-- Поиск записи -->
        <div class="search-section">
            <h2>Проверить мою запись</h2>
            <label for="search-phone">Введите номер телефона:</label>
            <input type="tel" id="search-phone" placeholder="Введите номер телефона">
            <button type="button" onclick="checkClientBooking()">Найти запись</button>
            <div id="client-result" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        // Четкий адрес нашего локального сервера Node.js на порту 3001
        const API_URL = 'http://localhost:3001/api/bookings';

        // Обработка отправки формы записи
        document.getElementById('booking-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newBooking = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                service: document.getElementById('service').value,
                master: document.getElementById('master').value,
                datetime: document.getElementById('datetime').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newBooking)
                });

                const data = await response.json();
                if (!response.ok) {
                    alert(data.error || 'Ошибка при создании записи');
                    return;
                }

                alert('Вы успешно записались!');
                this.reset();
            } catch (err) {
                console.error(err);
                alert('Не удалось подключиться к серверу!');
            }
        });

        // Функция поиска записи по номеру телефона
        async function checkClientBooking() {
            const phoneInput = document.getElementById('search-phone').value.trim();
            const resultDiv = document.getElementById('client-result');

            if (!phoneInput) {
                resultDiv.innerHTML = '<span style="color: #e74c3c;">Введите номер телефона для поиска</span>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/phone/${encodeURIComponent(phoneInput)}`);
                const data = await response.json();

                if (!response.ok) {
                    resultDiv.innerHTML = `<span style="color: #e74c3c;">${data.error || 'Записи не найдены'}</span>`;
                    return;
                }

                resultDiv.innerHTML = `
                    <div style="background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px solid #ddd;">
                        <p><b>Услуга:</b> ${data.service}</p>
                        <p><b>Мастер:</b> ${data.master}</p>
                        <p><b>Дата и время:</b> ${new Date(data.datetime).toLocaleString()}</p>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = '<span style="color: #e74c3c;">Ошибка соединения с сервером</span>';
            }
        }
    </script>
</body>
</html>
